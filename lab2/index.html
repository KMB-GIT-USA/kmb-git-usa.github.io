<!DOCTYPE html>
<html>
    <head>
        <title> Guess a Number </title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>

        <header>
            <h1>Guess the Number!</h1>
            <h2>Guess a number between 1 and 99 in seven attempts!</h2>
        </header>
        <br>
        <div id="main">
          Enter a guess: 
          <input type="text" id="playerGuess" size="5">         
          <button id="guessBtn"> Guess </button> <br>
          <button id="resetBtn"> Reset </button> 
          <div id="feedback"></div>
          <div id="stats" hidden>
            <p>Wins: <span id="winsDisplay">0</span></p>
            <p>Losses: <span id="lossesDisplay">0</span></p>
          </div>
          <div>
            Previous Guesses: 
                <span id="guesses"></span>
          </div>
          <div>
            Attempts Remaining:
            <span id="attemptsLeft"></span>
          </div>
        </div>
        <script src="js/script.js"></script>
    </body>
</html>
